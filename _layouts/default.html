<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% include head-custom.html %}

    <style>
      /* Base Dashboard Theme */
      body {
        background-color: #0f0f0f;
        color: #e0e0e0;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        margin: 0;
      }

      .wrapper {
        display: flex;
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      /* Circular Profile Image */
      .profile-img {
        width: 160px;
        height: 160px;
        border-radius: 50%; /* Circle */
        border: 2px solid #add8e6;
        object-fit: cover;
        margin-bottom: 25px;
        box-shadow: 0 0 15px rgba(173, 216, 230, 0.2);
      }

      /* Sidebar Navigation */
      header {
        width: 280px;
        flex-shrink: 0;
        padding-right: 40px;
        border-right: 1px solid #222;
        position: sticky;
        top: 40px;
        height: fit-content;
      }

      /* Main Content Area */
      section {
        flex-grow: 1;
        padding-left: 50px;
      }

      /* SHINING HEADING ANIMATION */
      h1, h2, h3 {
        color: #add8e6 !important;
        position: relative;
        display: inline-block;
        background: linear-gradient(to right, #add8e6 20%, #fff 50%, #add8e6 80%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
        font-weight: 700;
        letter-spacing: 1px;
      }

      @keyframes shine {
        to { background-position: 200% center; }
      }

      /* Professional Dashboard Details */
      .personal-details ul {
        list-style: none;
        padding: 0;
        margin-top: 30px;
      }

      .personal-details li {
        margin-bottom: 20px;
      }

      .detail-label {
        display: block;
        font-size: 10px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 4px;
      }

      .detail-value, .detail-value a {
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
      }

      /* ANIMATED DOWNLOAD BUTTON */
      .btn-cv {
        display: block;
        text-align: center;
        background: transparent;
        color: #add8e6 !important;
        border: 1px solid #add8e6;
        padding: 14px;
        margin-top: 30px;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
        border-radius: 4px;
        transition: 0.3s;
        position: relative;
        overflow: hidden;
        animation: pulse-border 2s infinite;
      }

      .btn-cv:hover {
        background: #add8e6;
        color: #000 !important;
        box-shadow: 0 0 20px rgba(173, 216, 230, 0.4);
      }

      @keyframes pulse-border {
        0% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(173, 216, 230, 0); }
        100% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0); }
      }

      /* Links */
      a { color: #add8e6; transition: 0.3s; }
      a:hover { color: #fff; }

      /* Mobile Responsive */
      @media (max-width: 850px) {
        .wrapper { flex-direction: column; align-items: center; }
        header { width: 100%; border-right: none; padding: 0; text-align: center; border-bottom: 1px solid #222; margin-bottom: 40px; padding-bottom: 40px; }
        section { padding-left: 0; width: 100%; }
        .profile-img { margin: 0 auto 20px; }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <img src="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/images/profile-pic.png" 
             alt="Profile" 
             class="profile-img">

        <h1>{{ site.title | default: "M.A. Rahman" }}</h1>
        <p style="color: #666; font-size: 14px;">Data Science Professional</p>

        <div class="personal-details">
          <ul>
            <li>
              <span class="detail-label">Location</span>
              <span class="detail-value">Dubai, UAE</span>
            </li>
            <li>
              <span class="detail-label">Professional Email</span>
              <span class="detail-value"><a href="mailto:rahmandatascience09@gmail.com">rahmandatascience09@gmail.com</a></span>
            </li>
            <li>
              <span class="detail-label">Connect</span>
              <span class="detail-value">
                <a href="https://github.com/Rahman17309" target="_blank">GitHub</a> / 
                <a href="https://www.linkedin.com/in/rahman17309" target="_blank">LinkedIn</a>
              </span>
            </li>
          </ul>

          <a href="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/Resume/MA-RAHMAN.pdf" 
             download="MA_Rahman_CV.pdf" 
             class="btn-cv">
            Download CV
          </a>
        </div>
      </header>

      <section>
        {{ content }}
      </section>
    </div>

    <footer style="text-align: center; padding: 40px; border-top: 1px solid #222; font-size: 11px; color: #444; letter-spacing: 1px;">
        &copy; 2026 M.A. RAHMAN &bull; DATA SCIENCE PORTFOLIO
    </footer>

    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
