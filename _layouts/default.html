<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --sidebar-color: #111111;
            --accent-blue: #add8e6;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        .wrapper {
            display: flex;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        header {
            width: 320px;
            background-color: var(--sidebar-color);
            padding: 60px 40px;
            border-right: 1px solid #222;
            position: sticky;
            top: 0;
            height: 100vh;
            box-sizing: border-box;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            object-fit: cover;
            margin-bottom: 30px;
        }

        /* Shining Animation for Headings */
        h1, h2, h3 {
            color: var(--accent-blue) !important;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #add8e6, #ffffff, #add8e6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .contact-info {
            margin-top: 40px;
            font-size: 0.85rem;
        }

        .label {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* Animated Download Button */
        .btn-download {
            display: block;
            margin-top: 40px;
            padding: 15px;
            text-align: center;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue) !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(173, 216, 230, 0); }
            100% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0); }
        }

        .btn-download:hover {
            background-color: var(--accent-blue);
            color: var(--bg-color) !important;
        }

        /* Main Content Area */
        section {
            flex: 1;
            padding: 60px 80px;
            background-color: var(--bg-color);
        }

        hr { border: 0; border-top: 1px solid #222; margin: 40px 0; }

        @media (max-width: 900px) {
            .wrapper { flex-direction: column; }
            header { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #222; text-align: center; }
            .profile-img { margin: 0 auto; }
            section { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/images/profile-pic.png" alt="M.A. Rahman" class="profile-img">
            <h1>M.A. RAHMAN</h1>
            <div class="contact-info">
                <span class="label">Location</span>
                <div>Dubai, United Arab Emirates</div>
                
                <span class="label">Email</span>
                <div><a href="mailto:rahmandatascience09@gmail.com" style="color:white; text-decoration:none;">rahmandatascience09@gmail.com</a></div>
                
                <span class="label">Network</span>
                <div>
                    <a href="https://linkedin.com/in/rahman17309" style="color:var(--accent-blue);">LinkedIn</a> / 
                    <a href="https://github.com/Rahman17309" style="color:var(--accent-blue);">GitHub</a>
                </div>
            </div>

            <a href="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/Resume/MA-RAHMAN.pdf" download class="btn-download">
                DOWNLOAD CV
            </a>
        </header>

        <section>
            {{ content }}
        </section>
    </div>
</body>
</html>
