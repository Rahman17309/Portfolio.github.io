<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/custom-style.css' | relative_url }}">
</head>
<body class="loading">

    <div id="loader-wrapper">
        <div id="data-stream"></div> <div class="loader-content">
            <div class="pie-loader"></div>
            <p id="loader-text">PARSING EXPERTISE...</p>
        </div>
    </div>

    <div class="wrapper">
        <header>
            <img src="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/images/profile-pic.png" alt="M.A. Rahman" class="profile-img">
            <h1>M.A. RAHMAN</h1>
            
            <div class="sidebar-info">
                <span class="info-label">Current Location</span> Dubai, UAE
                <span class="info-label">Email</span> rahmandatascience09@gmail.com
                <span class="info-label">Professional Hubs</span>
                <a href="https://linkedin.com/in/rahman17309" class="social-link">LinkedIn</a> / 
                <a href="https://github.com/Rahman17309" class="social-link">GitHub</a>
            </div>

            <a href="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/Resume/MA-RAHMAN.pdf" download class="btn-cv">
                DOWNLOAD RESUME
            </a>
        </header>

        <section>
            {{ content }}
        </section>
    </div>

    <script>
        window.addEventListener("load", function() {
            const loader = document.getElementById("loader-wrapper");
            const stream = document.getElementById("data-stream");
            const body = document.body;

            // Data Analyst Word Cloud Dictionary
            const words = [
                "PYTHON", "SQL", "TABLEAU", "POWER BI", "MACHINE LEARNING", 
                "BIG DATA", "STATISTICS", "R", "PANDAS", "NUMPY", "ETL", 
                "DATA MINING", "MATPLOTLIB", "SCIKIT-LEARN", "DEEP LEARNING", 
                "DATA CLEANING", "EXCEL", "NLP", "REGRESSION", "CLUSTERING"
            ];

            // Spawn words every 120ms
            const spawnWords = setInterval(() => {
                const el = document.createElement("div");
                el.className = "cloud-word";
                
                // Randomize word and appearance
                el.innerText = words[Math.floor(Math.random() * words.length)];
                
                // Random position from center
                const x = (Math.random() - 0.5) * 80; // horizontal spread
                const y = (Math.random() - 0.5) * 80; // vertical spread
                el.style.setProperty('--x', `${x}vw`);
                el.style.setProperty('--y', `${y}vh`);
                
                // Random starting size
                const size = Math.random() * (2.5 - 0.8) + 0.8;
                el.style.fontSize = `${size}rem`;
                
                // Random position on screen
                el.style.left = "50%";
                el.style.top = "50%";

                stream.appendChild(el);
                setTimeout(() => el.remove(), 2000);
            }, 120);

            // Transition to main site
            setTimeout(() => {
                clearInterval(spawnWords);
                loader.classList.add("loader-hidden");
                body.classList.remove("loading");
            }, 4000); 
        });
    </script>
</body>
</html>
