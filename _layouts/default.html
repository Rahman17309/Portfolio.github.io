<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <style>
        :root {
            --bg-dark: #0d1117;
            --sidebar-bg: #161b22;
            --accent-blue: #add8e6;
            --text-dim: #c9d1d9;
            --border: #30363d;
        }

        body { background-color: var(--bg-dark); color: var(--text-dim); font-family: 'Inter', sans-serif; margin: 0; line-height: 1.7; }
        .wrapper { display: flex; max-width: 1440px; margin: 0 auto; }

        header {
            width: 330px; background-color: var(--sidebar-bg); padding: 50px 30px;
            border-right: 1px solid var(--border); height: 100vh; position: sticky;
            top: 0; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }

        .profile-img {
            width: 160px; height: 160px; border-radius: 50%; border: 3px solid var(--accent-blue);
            object-fit: cover; margin-bottom: 25px; box-shadow: 0 0 20px rgba(173, 216, 230, 0.2);
        }

        h1 { font-size: 1.6rem; color: var(--accent-blue) !important; text-align: center; }
        
        .nav-item { margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; width: 100%; }
        .label { display: block; color: #8b949e; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }

        .btn-cv {
            display: block; width: 100%; padding: 14px; margin-top: 30px;
            border: 1px solid var(--accent-blue); color: var(--accent-blue) !important;
            text-decoration: none; text-align: center; font-weight: bold; font-size: 0.8rem;
            animation: pulse 2s infinite; border-radius: 4px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0.3); }
            70% { box-shadow: 0 0 0 10px rgba(173, 216, 230, 0); }
            100% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0); }
        }

        section { flex: 1; padding: 60px 80px; max-width: 900px; }
        h2, h3 { color: var(--accent-blue); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        @media (max-width: 1000px) {
            .wrapper { flex-direction: column; }
            header { width: 100%; height: auto; position: relative; border-right: none; }
            section { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="{{ site.logo }}" alt="Profile" class="profile-img">
            <h1>{{ site.title }}</h1>
            <p style="font-size: 0.8rem; color: #8b949e; text-align: center;">{{ site.tagline }}</p>
            
            <div style="width:100%;">
                <div class="nav-item">
                    <span class="label">Location</span> {{ site.location }}
                </div>
                <div class="nav-item">
                    <span class="label">Email</span>
                    <a href="mailto:{{ site.email }}" style="color:white; text-decoration:none;">{{ site.email }}</a>
                </div>
                <div class="nav-item">
                    <span class="label">Networks</span>
                    <a href="https://linkedin.com/in/{{ site.linkedin_username }}" style="color:var(--accent-blue);">LinkedIn</a> / 
                    <a href="https://github.com/{{ site.github_username }}" style="color:var(--accent-blue);">GitHub</a>
                </div>
            </div>

            <a href="{{ site.cv_url }}" download class="btn-cv">DOWNLOAD EXTENDED CV</a>
        </header>

        <section>
            {{ content }}
        </section>
    </div>
</body>
</html>
