<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <style>
        :root {
            --bg-primary: #0d1117;
            --sidebar-bg: #161b22;
            --accent-blue: #add8e6;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            line-height: 1.7;
        }

        .wrapper {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Dashboard Sidebar */
        header {
            width: 320px;
            background-color: var(--sidebar-bg);
            padding: 60px 35px;
            border-right: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent-blue);
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(173, 216, 230, 0.2);
        }

        /* Shining Heading Animation */
        h1, h2, h3 {
            color: var(--accent-blue) !important;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #add8e6, #fff, #add8e6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .contact-details {
            width: 100%;
            margin-top: 30px;
            font-size: 0.85rem;
        }

        .meta-label {
            display: block;
            color: #8b949e;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        /* Animated Pulse Button */
        .btn-download {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 40px;
            text-align: center;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue) !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 4px;
            animation: pulse-glow 2s infinite;
            transition: 0.3s;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(173, 216, 230, 0); }
            100% { box-shadow: 0 0 0 0 rgba(173, 216, 230, 0); }
        }

        .btn-download:hover {
            background-color: var(--accent-blue);
            color: var(--bg-primary) !important;
        }

        /* Main Content Section */
        section {
            flex: 1;
            padding: 60px 80px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background: #161b22;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 15px;
            text-align: left;
        }

        th {
            background-color: #21262d;
            color: var(--accent-blue);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        hr { border: 0; border-top: 1px solid var(--border-color); margin: 50px 0; }

        @media (max-width: 950px) {
            .wrapper { flex-direction: column; }
            header { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border-color); }
            section { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/images/profile-pic.png" alt="M.A. Rahman" class="profile-img">
            <h1>M.A. RAHMAN</h1>
            <div class="contact-details">
                <span class="meta-label">Current Role</span>
                <div style="color:white">Data Analyst @ PDA Infotech</div>
                
                <span class="meta-label">Location</span>
                <div style="color:white">Dubai, United Arab Emirates</div>

                <span class="meta-label">Direct Connect</span>
                <div style="margin-top:5px">
                    <a href="mailto:rahmandatascience09@gmail.com" style="color:var(--accent-blue); text-decoration:none">Email</a> | 
                    <a href="https://linkedin.com/in/rahman17309" target="_blank" style="color:var(--accent-blue); text-decoration:none">LinkedIn</a> | 
                    <a href="https://github.com/Rahman17309" target="_blank" style="color:var(--accent-blue); text-decoration:none">GitHub</a>
                </div>
            </div>

            <a href="https://raw.githubusercontent.com/Rahman17309/Portfolio.github.io/main/Resume/MA-RAHMAN.pdf" download class="btn-download">
                DOWNLOAD FULL CV
            </a>
        </header>

        <section>
            {{ content }}
        </section>
    </div>
</body>
</html>
